name: Web CI/CD

on:
  push:

concurrency:
  group: web
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: |
          if [ "${{ vars.SKIP_TESTS }}" = "true" ]; then
            echo "::warning title=Tests skipped::SKIP_TESTS=true — relay-web built without running its suite"
          else
            npm run test
          fi

      - name: build
        run: npm run build

      - uses: docker/setup-qemu-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name and tag
        if: github.ref == 'refs/heads/main'
        id: img
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/relay-web" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          provenance: false
          tags: |
            ${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: deploy
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT:    ${{ vars.DEPLOY_SSH_PORT || '22' }}
          RAW_PATH:    ${{ vars.DEPLOY_PATH || '/opt/relay/deploy' }}
          TAG:         ${{ steps.img.outputs.tag }}
          GHCR_USER:   ${{ github.actor }}
          GHCR_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          SSH_TARGET="$(trim "$DEPLOY_USER")@$(trim "$DEPLOY_HOST")"
          SSH_PORT="$(trim "$SSH_PORT")"
          DEPLOY_PATH="$(trim "$RAW_PATH")"
          echo "deploying web to $DEPLOY_PATH on port $SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: the deploy key is on this
          # runner, and accepting any host key hands it to whatever answers on port 22.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

          # The roll happens inline: the backend repo no longer ships a deploy script, and its CI
          # copies only docker-compose.yml and nginx/ to the server. WEB_TAG is rewritten in .env so
          # the running tag is visible on the box; on a failed health wait the previous tag is put
          # back and rolled, so a broken image never stays live.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_TARGET" \
            TAG="$TAG" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" DEPLOY_PATH="$DEPLOY_PATH" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # The server owns .env; CI never creates it. Say who is looking and what is there.
          test -f .env || { echo "::error::$DEPLOY_PATH/.env is missing for $(id -un) on $(hostname)"; ls -la; exit 1; }
          exec 9>.web-deploy.lock; flock 9
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          PREV="$(sed -n 's/^WEB_TAG=//p' .env)"
          set_tag() { grep -q '^WEB_TAG=' .env && sed -i "s/^WEB_TAG=.*/WEB_TAG=$1/" .env || echo "WEB_TAG=$1" >> .env; }
          set_tag "$TAG"
          if docker compose pull --quiet web && docker compose up -d --no-deps --wait web; then
            docker image prune -f >/dev/null
            echo "web is on $TAG"
          else
            echo "::error::web $TAG did not become healthy; rolling back to ${PREV:-latest}"
            set_tag "${PREV:-latest}"
            docker compose up -d --no-deps --wait web || true
            exit 1
          fi
          REMOTE
