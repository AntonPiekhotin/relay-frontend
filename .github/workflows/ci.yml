name: Web CI/CD

on:
  push:

concurrency:
  group: web
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: |
          if [ "${{ vars.SKIP_TESTS }}" = "true" ]; then
            echo "::warning title=Tests skipped::SKIP_TESTS=true — relay-web built without running its suite"
          else
            npm run test
          fi

      - name: build
        run: npm run build

      - uses: docker/setup-qemu-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main'

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name and tag
        if: github.ref == 'refs/heads/main'
        id: img
        run: |
          echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/relay-web" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          platforms: linux/arm64,linux/amd64
          provenance: false
          tags: |
            ${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.repo }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: deploy
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT:    ${{ vars.DEPLOY_SSH_PORT || '22' }}
          RAW_PATH:    ${{ vars.DEPLOY_PATH || '/opt/relay' }}
          TAG:         ${{ steps.img.outputs.tag }}
        run: |
          set -euo pipefail

          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          SSH_TARGET="$(trim "$DEPLOY_USER")@$(trim "$DEPLOY_HOST")"
          SSH_PORT="$(trim "$SSH_PORT")"
          DEPLOY_PATH="$(trim "$RAW_PATH")"
          echo "deploying web to $DEPLOY_PATH on port $SSH_PORT"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key rather than StrictHostKeyChecking=no: the deploy key is on this
          # runner, and accepting any host key hands it to whatever answers on port 22.
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_TARGET" bash -s <<REMOTE
          set -euo pipefail
          cd "$DEPLOY_PATH"
          deploy/apply.sh web "$TAG"
          REMOTE
