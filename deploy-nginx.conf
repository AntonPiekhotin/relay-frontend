# The SPA's own listener, inside the image. Reached only over the `relay-network` bridge, from the
# edge nginx one hop away, and never from the internet — the compose entry publishes no ports.
#
# So TLS, HSTS, X-Frame-Options, Referrer-Policy, X-Content-Type-Options and the connection limit
# all stay at the edge and are deliberately absent here. Setting any of them again would send the
# header twice, and nginx does not dedupe `add_header`.
#
# This file is copied verbatim to /etc/nginx/conf.d/default.conf. There is no envsubst step and no
# ${...} placeholder, unlike the edge's relay.conf.template — nothing here varies per deployment,
# which is the same reason the bundle needs no build-time configuration.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressing here is what actually shrinks the bundle on the wire. The edge has `gzip on`
    # too, but it will not re-encode a response that arrives from an upstream already encoded —
    # so if this listener serves plain text, the client gets plain text.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    # What the compose healthcheck probes (`wget -q -O - http://127.0.0.1/healthz | grep -q ok`).
    # An exact match, so the SPA fallback below can never swallow it and answer with index.html —
    # which would still contain no "ok" and would fail the check in a confusing way.
    # access_log off because it fires every 15 seconds forever.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite content-hashes every filename under /assets, so the name changes whenever the bytes do.
    # That is what makes a year-long immutable cache safe here, and it is also what lets
    # index.html be uncacheable at no cost.
    #
    # `=404` rather than falling through to index.html: a request for a hashed asset that does not
    # exist means the client is running an index.html from a previous deploy. Answering it with
    # HTML produces "Unexpected token '<'" in the console; a 404 says what actually happened.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html names the hashed assets, so a cached copy makes a deploy invisible — returning
    # clients keep asking for the old bundle until they hard-refresh.
    #
    # `no-cache`, not `no-store`. It means "revalidate before use", not "do not keep": the browser
    # still sends If-None-Match, so an unchanged deploy answers 304 from the ETag instead of
    # re-sending the document. `no-store` would forbid that and cost a full download every load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router owns the path space — /chat/42 exists in the client only and this server has no
    # route for it. A deep link, a refresh or a bookmark must therefore return index.html and let
    # the router resolve the path once the bundle has booted.
    #
    # `try_files`' last parameter is a URI, so it is an internal *redirect*: location matching runs
    # again and `= /index.html` above is what serves it. That is how the fallback picks up the
    # `no-cache` header rather than bypassing it.
    #
    # Note what this means — an unknown path returns 200 with HTML, not 404. That is the standard
    # SPA trade, and it is exactly why /assets/ is pinned to =404 above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
